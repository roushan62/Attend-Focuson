# Deploy the SiteTrack frontend (everything inside frontend/) to GitHub Pages.
#
# ONE-TIME MANUAL STEP: GitHub only accepts workflow files pushed with the
# `workflows` permission, so this template ships outside .github/. Copy it once
# (locally or via the web editor) and enable Pages:
#
#   mkdir -p .github/workflows
#   cp deploy/github-pages.workflow.yml .github/workflows/pages.yml
#   git add .github && git commit -m "enable pages workflow" && git push
#
# Then: Settings → Pages → Source: "GitHub Actions".
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
