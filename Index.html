<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Astra HR</title>
<script>
/* apply persisted theme before first paint (no flash) */
(function () {
  try {
    var t = localStorage.getItem('astra.theme');
    if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<style>
/* =====================================================================
   ASTRA card theme — CSS variables (brandable) + light/dark
   ===================================================================== */
:root{
  --primary:#4F46E5; --primary-rgb:79,70,229; --on-primary:#fff; --primary-fg:var(--primary);
  --primary-soft:rgba(var(--primary-rgb),.10); --primary-ring:rgba(var(--primary-rgb),.28);
  --bg:#F5F6F8; --card:#FFFFFF; --card-2:#F9FAFB; --text:#111827; --muted:#6B7280; --border:#E5E7EB; --input-bg:#fff;
  --success:#16A34A; --success-soft:rgba(22,163,74,.12); --warning:#B45309; --warning-soft:rgba(245,158,11,.16);
  --danger:#DC2626; --danger-soft:rgba(220,38,38,.10); --info:#0369A1; --info-soft:rgba(2,132,199,.12);
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05);
  --shadow-hover:0 4px 10px rgba(16,24,40,.06),0 14px 32px rgba(16,24,40,.10);
  --radius:16px; --sidebar-w:252px; --ease:cubic-bezier(.4,0,.2,1);
  --skel-a:#EEF0F3; --skel-b:#F8F9FA;
}
[data-theme="dark"]{
  --bg:#0E1016; --card:#171A22; --card-2:#1C2029; --text:#E8EAF0; --muted:#9AA3B2; --border:#2A2F3B; --input-bg:#12151C;
  --primary-fg:color-mix(in srgb,var(--primary) 58%,#fff); --primary-soft:rgba(var(--primary-rgb),.22); --primary-ring:rgba(var(--primary-rgb),.45);
  --success:#4ADE80; --success-soft:rgba(74,222,128,.14); --warning:#FBBF24; --warning-soft:rgba(251,191,36,.14);
  --danger:#F87171; --danger-soft:rgba(248,113,113,.14); --info:#38BDF8; --info-soft:rgba(56,189,248,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.28); --shadow-hover:0 6px 14px rgba(0,0,0,.45),0 18px 40px rgba(0,0,0,.4);
  --skel-a:#232733; --skel-b:#2C3140; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;transition:background .2s var(--ease),color .2s var(--ease)}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:24px}h2{font-size:20px}h3{font-size:16px}
p{margin:0}
a{color:var(--primary-fg);text-decoration:none}
button{font:inherit;color:inherit}
.muted{color:var(--muted)}.meta{font-size:12px;color:var(--muted)}.strong{font-weight:600}.right{text-align:right}.center{text-align:center}
.hide{display:none!important}.nowrap{white-space:nowrap}.mono{font-variant-numeric:tabular-nums}
.ic{flex:none;vertical-align:middle}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.spread{justify-content:space-between}.grow{flex:1;min-width:0}.gap-s{gap:6px}.gap-l{gap:20px}
.mt{margin-top:16px}.mt-s{margin-top:8px}.mt-l{margin-top:24px}.mb{margin-bottom:16px}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);background:var(--card);border-right:1px solid var(--border);z-index:60;display:flex;flex-direction:column;transition:transform .22s var(--ease),width .22s var(--ease)}
.brand{display:flex;align-items:center;gap:12px;height:64px;padding:0 20px;flex:none}
.logo-mark{width:36px;height:36px;border-radius:10px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.logo-mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand-name{font-weight:700;font-size:16px;line-height:1.15}.brand-sub{font-size:11px;color:var(--muted)}
.nav{flex:1;overflow:auto;padding:8px 12px 16px}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;margin:2px 0;border:0;background:none;border-radius:12px;color:var(--muted);font-weight:500;cursor:pointer;text-align:left;transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--ease)}
.nav-item:hover{background:var(--primary-soft);color:var(--text);transform:translateX(2px)}
.nav-item.active{background:var(--primary-soft);color:var(--primary-fg);font-weight:600}
.nav-item::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--primary);transform:scaleY(0);transition:transform .2s var(--ease)}
.nav-item.active::before{transform:scaleY(1)}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}
.sidebar-foot{padding:12px;border-top:1px solid var(--border);flex:none}
.main{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;flex-direction:column;transition:margin .22s var(--ease)}
.app.collapsed .sidebar{width:76px}.app.collapsed .main{margin-left:76px}
.app.collapsed .nav-label,.app.collapsed .brand-text,.app.collapsed .nav-badge,.app.collapsed .sidebar-foot .label{display:none}
.app.collapsed .nav-item{justify-content:center;padding:12px}.app.collapsed .brand{justify-content:center;padding:0}
.header{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;gap:14px;padding:0 24px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.header .h-logo{display:none;align-items:center;gap:10px}
.search{position:relative;flex:1;max-width:520px;margin:0 auto}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--bg);padding:0 14px 0 40px;color:var(--text);outline:none;transition:border-color .18s,box-shadow .18s,background .18s}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-ring);background:var(--input-bg)}
.search .ic{position:absolute;left:13px;top:11px;color:var(--muted)}
.dropdown{position:absolute;z-index:70;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-hover);padding:8px;min-width:260px;max-height:70vh;overflow:auto;animation:pop .16s var(--ease)}
.search .dropdown{left:0;right:0;top:48px}
.dd-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left;transition:background .15s}
.dd-item:hover{background:var(--primary-soft)}
.dd-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px}
.icon-btn{position:relative;width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:background .18s,color .18s,transform .12s}
.icon-btn:hover{background:var(--primary-soft);color:var(--text)}.icon-btn:active{transform:scale(.94)}
.dot{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:99px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary-soft);color:var(--primary-fg);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;overflow:hidden;background-size:cover;background-position:center}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:72px;height:72px;font-size:24px}.avatar.sm{width:30px;height:30px;font-size:11px}
.profile-btn{display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px 8px 4px 4px;border-radius:14px;cursor:pointer;transition:background .18s}
.profile-btn:hover{background:var(--primary-soft)}
.content{padding:24px;width:100%;max-width:1480px;margin:0 auto;flex:1}
.view{animation:enter .24s var(--ease)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head p{color:var(--muted);margin-top:2px}
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.show{opacity:1;pointer-events:auto}

/* ---------- cards & grids ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;border:1px solid color-mix(in srgb,var(--border) 55%,transparent);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.card.lift:hover,.stat:hover,.card.click:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.card.click{cursor:pointer}
.card.flat{box-shadow:none;background:var(--card-2)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card-head h3{font-size:16px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}.g-stat{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.span2{grid-column:span 2}
.stat{display:flex;flex-direction:column;gap:8px;padding:18px 20px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--border) 55%,transparent);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.stat .top{display:flex;align-items:center;justify-content:space-between}
.stat .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-fg)}
.stat .ico.green{background:var(--success-soft);color:var(--success)}.stat .ico.amber{background:var(--warning-soft);color:var(--warning)}.stat .ico.red{background:var(--danger-soft);color:var(--danger)}.stat .ico.blue{background:var(--info-soft);color:var(--info)}
.stat .num{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat .lbl{color:var(--muted);font-size:13px}
.trend{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 8px}
.trend.up{color:var(--success);background:var(--success-soft)}.trend.down{color:var(--danger);background:var(--danger-soft)}.trend.flat{color:var(--muted);background:var(--card-2)}

/* ---------- buttons & forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;border:1px solid transparent;background:var(--primary);color:var(--on-primary);font-weight:600;cursor:pointer;white-space:nowrap;transition:background .18s,box-shadow .18s,transform .12s,opacity .18s,border-color .18s}
.btn:hover{box-shadow:0 6px 16px var(--primary-ring);filter:brightness(1.05)}.btn:active{transform:scale(.97)}
.btn:focus-visible,.icon-btn:focus-visible,.nav-item:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;box-shadow:0 0 0 4px var(--primary-ring)}
.btn.secondary{background:var(--card);color:var(--text);border-color:var(--border)}.btn.secondary:hover{background:var(--primary-soft);box-shadow:none;filter:none;border-color:var(--primary)}
.btn.ghost{background:transparent;color:var(--primary-fg)}.btn.ghost:hover{background:var(--primary-soft);box-shadow:none}
.btn.success{background:var(--success);color:#fff}.btn.danger{background:var(--danger);color:#fff}.btn.danger.outline{background:transparent;color:var(--danger);border-color:var(--danger)}
[data-theme="dark"] .btn.success,[data-theme="dark"] .btn.danger{color:#0b0d12}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:10px}.btn.lg{height:48px;font-size:15px;padding:0 22px}.btn.block{width:100%}
.btn:disabled,.btn.busy{opacity:.6;cursor:not-allowed;pointer-events:none}
.btn.busy::after{content:"";width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form-grid .full{grid-column:1/-1}
.form-sec{grid-column:1/-1;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:8px;border-top:1px dashed var(--border);margin-top:4px}
.form-sec:first-child{border-top:0;margin-top:0;padding-top:0}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:13px;font-weight:600}
.field .req{color:var(--danger)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=month],input[type=time],input[type=password],input[type=search],select,textarea{width:100%;height:42px;padding:0 12px;border-radius:12px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font:inherit;transition:border-color .18s,box-shadow .18s;outline:none;min-width:0}
textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-ring)}
input[readonly]{background:var(--card-2);color:var(--muted)}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger)}
.err{color:var(--danger);font-size:12px;min-height:0}.err:empty{display:none}
.hint{font-size:12px;color:var(--muted)}
input[type=file]{font-size:13px;padding:8px;height:auto}
input[type=color]{padding:3px;height:42px;width:64px}
input[type=checkbox],input[type=radio]{width:17px;height:17px;accent-color:var(--primary);cursor:pointer}
.check{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.seg{display:inline-flex;background:var(--card-2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .18s}
.seg button.on{background:var(--card);color:var(--primary-fg);box-shadow:var(--shadow)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar .search-mini{position:relative;min-width:200px}
.toolbar .search-mini input{height:38px;padding-left:36px}
.toolbar .search-mini .ic{position:absolute;left:11px;top:10px;color:var(--muted)}
.toolbar select,.toolbar input[type=month],.toolbar input[type=date]{height:38px;width:auto;min-width:130px}

/* ---------- badges / chips / alerts ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--card-2);color:var(--muted);white-space:nowrap}
.badge.green{background:var(--success-soft);color:var(--success)}.badge.amber{background:var(--warning-soft);color:var(--warning)}.badge.red{background:var(--danger-soft);color:var(--danger)}.badge.blue{background:var(--info-soft);color:var(--info)}.badge.primary{background:var(--primary-soft);color:var(--primary-fg)}
.alert{display:flex;gap:12px;padding:12px 14px;border-radius:12px;background:var(--info-soft);color:var(--text);border:1px solid color-mix(in srgb,var(--info) 30%,transparent);align-items:flex-start}
.alert.warn{background:var(--warning-soft);border-color:color-mix(in srgb,var(--warning) 35%,transparent)}.alert.danger{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}.alert.ok{background:var(--success-soft);border-color:color-mix(in srgb,var(--success) 35%,transparent)}
.alert .ic{margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 16px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .18s,border-color .18s}
.tab:hover{color:var(--text)}.tab.on{color:var(--primary-fg);border-color:var(--primary)}
.tab .cnt{margin-left:6px;background:var(--danger);color:#fff;border-radius:99px;font-size:11px;padding:0 6px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500;word-break:break-word}
.divider{height:1px;background:var(--border);margin:16px 0}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}.list-item:last-child{border-bottom:0}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;margin:0 -8px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:transparent}
.tbl th.sortable{cursor:pointer;user-select:none}.tbl th.sortable:hover{color:var(--text)}
.tbl td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr{transition:background .15s}.tbl tbody tr:hover{background:var(--primary-soft)}.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.clickable{cursor:pointer}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
.empty{display:grid;place-items:center;text-align:center;padding:40px 16px;color:var(--muted);gap:8px}
.empty .ic-wrap{width:64px;height:64px;border-radius:20px;background:var(--primary-soft);color:var(--primary-fg);display:grid;place-items:center;margin-bottom:4px}
.empty h4{color:var(--text);font-size:16px}

/* ---------- skeleton ---------- */
.sk{position:relative;overflow:hidden;background:var(--skel-a);border-radius:8px;min-height:14px}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--skel-b),transparent);transform:translateX(-100%);animation:shimmer 1.3s infinite}
.sk.line{height:14px;margin:8px 0}.sk.tall{height:110px;border-radius:12px}.sk.circle{border-radius:50%}
#progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--primary);z-index:200;transition:width .3s var(--ease),opacity .3s;opacity:0}
#progress.on{opacity:1}

/* ---------- toast / modal / drawer ---------- */
#toasts{position:fixed;top:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:10px;width:min(380px,calc(100vw - 32px))}
.toast{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--info);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow-hover);animation:toastIn .28s var(--ease)}
.toast.success{border-left-color:var(--success)}.toast.error{border-left-color:var(--danger)}.toast.warn{border-left-color:var(--warning)}
.toast.out{animation:toastOut .22s var(--ease) forwards}
.toast .ic{margin-top:1px}.toast.success .ic{color:var(--success)}.toast.error .ic{color:var(--danger)}.toast.warn .ic{color:var(--warning)}.toast.info .ic{color:var(--info)}
.backdrop{position:fixed;inset:0;background:rgba(10,12,18,.55);z-index:100;display:grid;place-items:center;padding:16px;animation:fade .2s var(--ease)}
.modal{background:var(--card);border-radius:20px;box-shadow:var(--shadow-hover);width:100%;max-width:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;animation:scaleIn .22s var(--ease);border:1px solid var(--border)}
.modal.lg{max-width:820px}.modal.sm{max-width:420px}.modal.xl{max-width:1000px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-body{padding:22px;overflow:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--border);flex-wrap:wrap}
.backdrop.drawer{place-items:stretch end;padding:0}
.drawer-panel{background:var(--card);width:min(560px,100vw);height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow-hover);animation:slideIn .24s var(--ease);border-left:1px solid var(--border)}
.drawer-panel .modal-body{flex:1}
.backdrop.closing{animation:fadeOut .16s forwards}.backdrop.closing .modal{animation:scaleOut .16s forwards}.backdrop.closing .drawer-panel{animation:slideOut .18s forwards}

/* ---------- charts ---------- */
.chart{width:100%;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .grid-line{stroke:var(--border);stroke-dasharray:3 4}
.chart .bar{fill:var(--primary);transition:opacity .15s}.chart .bar:hover{opacity:.75}
.chart .line{fill:none;stroke:var(--primary);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .area{fill:url(#areaGrad)}.chart .pt{fill:var(--card);stroke:var(--primary);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.pie-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center}

/* ---------- attendance grid / calendar ---------- */
.agrid{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.agrid th,.agrid td{padding:4px;text-align:center;border-bottom:1px solid var(--border);min-width:27px}
.agrid th{font-size:11px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card)}
.agrid th.sun{color:var(--danger)}
.agrid td.name,.agrid th.name{position:sticky;left:0;background:var(--card);text-align:left;min-width:170px;padding:6px 10px;z-index:1;border-right:1px solid var(--border)}
.agrid td.sum{font-weight:700;min-width:34px}
.cc{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font-size:11px;font-weight:700}
.cc.P{background:var(--success-soft);color:var(--success)}.cc.L{background:var(--warning-soft);color:var(--warning)}.cc.H{background:rgba(249,115,22,.16);color:#EA580C}
.cc.V{background:var(--info-soft);color:var(--info)}.cc.U{background:var(--danger-soft);color:var(--danger);opacity:.8}.cc.S{background:rgba(139,92,246,.16);color:#7C3AED}
.cc.W{background:var(--card-2);color:var(--muted)}.cc.O{background:rgba(20,184,166,.16);color:#0D9488}.cc.A{background:var(--danger-soft);color:var(--danger)}
.cc.X{background:repeating-linear-gradient(45deg,var(--danger-soft),var(--danger-soft) 4px,transparent 4px,transparent 8px);color:var(--danger);border:1px dashed var(--danger)}
.cc.F,.cc.dash{background:transparent;color:var(--muted)}
[data-theme="dark"] .cc.H{color:#FDBA74}[data-theme="dark"] .cc.S{color:#C4B5FD}[data-theme="dark"] .cc.O{color:#5EEAD4}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;padding:4px 0}
.cal .day{aspect-ratio:1/.9;min-height:46px;border-radius:12px;border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 2px;background:var(--card);cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;font-size:12px}
.cal .day:hover{border-color:var(--primary);transform:translateY(-1px)}.cal .day.sel{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}.cal .day.today{font-weight:800;color:var(--primary-fg)}
.cal .day.blank{border:0;background:none;cursor:default}
.legend-codes{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted);margin-top:12px}.legend-codes span{display:inline-flex;align-items:center;gap:5px}

/* ---------- misc blocks ---------- */
.hero-status{display:flex;align-items:center;gap:16px}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--success);box-shadow:0 0 0 0 var(--success);animation:pulse 1.8s infinite}.pulse.off{background:var(--muted);animation:none}.pulse.warn{background:var(--warning);animation:none}
.bar-track{height:8px;border-radius:99px;background:var(--card-2);overflow:hidden}.bar-fill{height:100%;background:var(--primary);border-radius:99px;transition:width .5s var(--ease)}
.map-frame{width:100%;height:220px;border:0;border-radius:14px;background:var(--card-2)}
.tpl-card{border:2px solid var(--border);border-radius:14px;padding:12px;cursor:pointer;transition:all .18s;background:var(--card)}.tpl-card:hover{border-color:var(--primary)}.tpl-card.on{border-color:var(--primary);background:var(--primary-soft)}
.tpl-thumb{height:90px;border-radius:8px;background:var(--card-2);margin-bottom:8px;position:relative;overflow:hidden}
.tpl-thumb i{position:absolute;left:10px;right:10px;height:6px;border-radius:3px;background:var(--border)}
.perm-table td,.perm-table th{text-align:center;padding:8px}.perm-table td:first-child,.perm-table th:first-child{text-align:left;text-transform:capitalize}
.comment{padding:12px 14px;border-radius:14px;background:var(--card-2);max-width:88%}.comment.mine{background:var(--primary-soft);margin-left:auto}
.timeline-dot{width:10px;height:10px;border-radius:50%;background:var(--primary);flex:none;margin-top:6px}
.payslip{border:1px solid var(--border);border-radius:14px;padding:20px}
.ps-table{width:100%;border-collapse:collapse}.ps-table td,.ps-table th{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left}.ps-table .r{text-align:right}
.pre-issue{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--card-2);margin-bottom:8px;align-items:flex-start}
.file-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:var(--card-2);border:1px solid var(--border);cursor:pointer;font-size:13px;transition:border-color .15s}.file-chip:hover{border-color:var(--primary)}
.preview-img{max-width:100%;max-height:70vh;border-radius:12px;display:block;margin:0 auto}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--primary);animation:spin .8s linear infinite;margin:0 auto}
.big-ic{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px}
.big-ic.ok{background:var(--success-soft);color:var(--success)}.big-ic.bad{background:var(--danger-soft);color:var(--danger)}

.bottom-bar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:45;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:10px}
.bottom-bar .btn{flex:1;height:48px;flex-direction:column;gap:2px;font-size:12px;padding:0 6px}

.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 500px at 10% -10%,var(--primary-soft),transparent),radial-gradient(900px 500px at 100% 110%,var(--primary-soft),transparent),var(--bg)}
.auth-split{display:grid;grid-template-columns:1.05fr 1fr;gap:24px;width:100%;max-width:1040px;align-items:stretch}

.auth-card{display:flex;flex-direction:column;justify-content:center;padding:32px}
.auth-links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;margin-top:14px}
.linkbtn{border:0;background:none;color:var(--primary-fg);font-weight:600;cursor:pointer;padding:0}.linkbtn:hover{text-decoration:underline}
.pw-wrap{position:relative}.pw-wrap .icon-btn{position:absolute;right:2px;top:1px;width:40px;height:40px}.pw-wrap input{padding-right:44px}

/* ---------- animations ---------- */
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes fadeOut{to{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}@keyframes scaleOut{to{opacity:0;transform:scale(.96)}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}@keyframes slideOut{to{transform:translateX(100%)}}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}
@keyframes shimmer{to{transform:translateX(100%)}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 10px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- responsive ---------- */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:1fr}}
@media (max-width:767px){
  .sidebar{transform:translateX(-102%);width:min(288px,86vw)!important;box-shadow:var(--shadow-hover)}
  .sidebar.open{transform:none}

  .main,.app.collapsed .main{margin-left:0}
  .header{padding:0 12px;gap:8px}.header .h-logo{display:flex}.header .desk-only{display:none}
  .search{max-width:none}.header .h-name{display:none}
  .content{padding:16px}.app.has-bar .content{padding-bottom:96px}
  .bottom-bar{display:flex}
  .g2,.g3,.g4,.g-main,.g-auto,.g-stat{grid-template-columns:1fr}.g-stat.two{grid-template-columns:1fr 1fr}.span2{grid-column:auto}
  .grid{gap:14px}.card{padding:16px}
  .form-grid{grid-template-columns:1fr}
  .page-head h1{font-size:21px}
  .auth-split{grid-template-columns:1fr}.auth-art{display:none}.auth-card{padding:22px 4px}
  .auth-wrap{padding:12px;align-items:start}
  .modal{max-height:calc(100vh - 16px);border-radius:18px}.backdrop{padding:8px;align-items:end}
  .modal-foot .btn{flex:1}
  /* tables become stacked card rows */
  table.tbl:not(.keep) thead{display:none}
  table.tbl:not(.keep),table.tbl:not(.keep) tbody,table.tbl:not(.keep) tr,table.tbl:not(.keep) td{display:block;width:100%}
  table.tbl:not(.keep) tr{border:1px solid var(--border);border-radius:14px;padding:6px 12px;margin-bottom:12px;background:var(--card)}
  table.tbl:not(.keep) td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border);text-align:right}
  table.tbl:not(.keep) td:last-child{border-bottom:0}
  table.tbl:not(.keep) td::before{content:attr(data-label);font-size:12px;font-weight:600;color:var(--muted);text-align:left;flex:none}
  table.tbl:not(.keep) td[data-label=""]::before{display:none}
  table.tbl:not(.keep) td.num{text-align:right}
  .table-wrap{margin:0}.kv{grid-template-columns:110px 1fr}
  .toolbar .search-mini{flex:1;min-width:0}.toolbar select{flex:1}
  .pager{justify-content:center}
  .cal{gap:4px}.cal .day{min-height:40px}
  #toasts{top:8px;right:8px}
}
@media print{.sidebar,.header,.bottom-bar,#toasts{display:none!important}.main{margin:0!important}}

function haversine(lat1, lon1, lat2, lon2) { // metres
  const R = 6371000, rad = (d) => d * Math.PI / 180, dLat = rad(lat2 - lat1), dLon = rad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

function getPosition(opts) { // best-of watch for up to `ms`, resolves {lat,lng,accuracy}
  opts = opts || {};
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject({ message: 'This device does not support location. Use a phone or enable GPS.' });
    let best = null, done = false, wid = null, t = null;
    const finish = (ok, v) => { if (done) return; done = true; if (wid !== null) navigator.geolocation.clearWatch(wid); clearTimeout(t); ok ? resolve(v) : reject(v); };
    t = setTimeout(() => best ? finish(true, best) : finish(false, { message: 'Could not get a GPS fix. Move to an open area and try again.' }), opts.ms || 9000);
    wid = navigator.geolocation.watchPosition((p) => {
      const c = { lat: p.coords.latitude, lng: p.coords.longitude, accuracy: Math.round(p.coords.accuracy || 0) };
      if (!best || c.accuracy < best.accuracy) best = c; if (opts.onFix) opts.onFix(best);
      if (c.accuracy <= (opts.goodEnough || 30)) finish(true, best);
    }, (err) => finish(false, { message: err.code === 1 ? 'Location permission is blocked. Allow location access for this site in your browser settings, then retry.' : 'Could not read your location. Turn on GPS and try again.' }), { enableHighAccuracy: true, maximumAge: 0, timeout: opts.ms || 9000 });
  });
}

async function doPunch(type, btn) {

  if (btn) { if (btn.disabled) return; btn.disabled = true; }
  let cancelled = false, refresh = false;
  const m = openModal({ title: label, size: 'sm', persistent: true, noFocus: true, onClose: () => { cancelled = true; if (btn) btn.disabled = false; if (refresh && (S.view === 'dashboard' || S.view === 'attendance')) route(); },
    body: '<div class="center" style="padding:10px 0"><div class="big-ic">' + icon('target', 34) + '</div><div class="spinner" style="margin:14px auto"></div><h4 id="pnTxt">Getting your location…</h4><p class="meta" id="pnSub">Stay outdoors or near a window for a better GPS signal.</p></div>', buttons: [{ label: 'Cancel' }] });
  const say = (t, s) => { const a = $('#pnTxt', m.body), b = $('#pnSub', m.body); if (a) a.textContent = t; if (b && s !== undefined) b.textContent = s; };
  let pos;
  try { pos = await getPosition({ ms: 9000, goodEnough: 30, onFix: (c) => { if (!cancelled) say('Improving accuracy… ±' + c.accuracy + ' m', proj ? 'You are about ' + Math.round(haversine(c.lat, c.lng, proj.lat, proj.lng)) + ' m from ' + proj.name + '.' : undefined); } }); }
  catch (e) { if (cancelled) return; return punchResult(m, false, label, e.message, [], btn, type); }
  if (cancelled) return;
  say('Verifying with the server…', 'Accuracy ±' + pos.accuracy + ' m');
  try { const r = await callApi('att.punch', { type, lat: pos.lat, lng: pos.lng, accuracy: pos.accuracy }, { silent: true }); refresh = true; punchResult(m, true, label, '', r, btn, type); }
  catch (e) { const d = e.details || {}; punchResult(m, false, label, e.message, d.distance !== undefined ? [['Your distance', d.distance + ' m'], ['Allowed radius', d.radius + ' m'], ['Project', d.projectName]] : [], btn, type, e); }
}
function punchResult(m, ok, label, msg, info, btn, type, err) {
  if (btn) btn.disabled = false;
  if (m.closed) return;
  let rows = [], head = ok ? label + ' recorded' : label + ' failed', sub = msg;
  if (ok) { const r = info; rows = [['Time', fmtTime(r.time)], ['Project', r.projectName], ['Distance from site', r.distance + ' m (limit ' + r.radius + ' m)']]; if (type === 'in') { if (r.late) rows.push(['Note', 'Marked late']); } else { rows.push(['Worked', fmtMins(r.workMinutes)], ['Day status', r.status]); } sub = type === 'in' ? (r.late ? 'You are in — but after the grace time.' : 'You are in. Have a great day!') : 'See you tomorrow!'; }
  else rows = info;
  m.body.innerHTML = '<div class="center"><div class="big-ic ' + (ok ? 'ok' : 'bad') + '">' + icon(ok ? 'checkcircle' : 'xcircle', 36) + '</div><h3 class="mt-s">' + esc(head) + '</h3><p class="' + (ok ? 'muted' : '') + '">' + esc(sub) + '</p></div>' + (rows.length ? '<div class="mt">' + kv(rows) + '</div>' : '');
  m.foot.innerHTML = ''; const close = html('<button class="btn secondary">Close</button>'); close.onclick = () => m.close(); m.foot.appendChild(close);
  if (!ok && err && err.code !== 'ALREADY_PUNCHED' && err.code !== 'NOT_PUNCHED_IN' && err.code !== 'NO_PROJECT' || (!ok && !err)) { const retry = html('<button class="btn">' + icon('refresh', 16) + 'Try again</button>'); retry.onclick = () => { m.close(); doPunch(type, btn); }; m.foot.appendChild(retry); }

VIEWS.employee.documents = function (host) {
  host.innerHTML = pageHead('Documents', 'Your uploaded files and company policies.') + skelCards(2);
  const load = async () => {
    let r; try { r = await callApi('me.documents'); } catch (e) { return errorBox(host, e, load); }
    host.innerHTML = pageHead('Documents', 'Your uploaded files and company policies.') +
      '<div class="card"><div class="card-head"><h3>My documents</h3></div>' + (r.own.length ? '<div class="col">' + r.own.map((x) => '<div class="row spread" style="padding:10px 0;border-bottom:1px solid var(--border)"><div class="row" style="gap:10px">' + icon('file', 18) + '<div><b>' + esc(x.docType) + '</b><div class="meta">' + esc(x.fileName) + ' · ' + fmtDate(x.createdAt) + '</div></div></div><button class="btn secondary sm" data-v="' + x.fileId + '" data-n="' + attr(x.docType) + '">' + icon('eye', 14) + 'View</button></div>').join('') + '</div>' : emptyHtml('Nothing uploaded', 'Your HR team uploads your ID proofs and letters here.', 'file')) + '</div>' +
      '<div class="card mt"><div class="card-head"><h3>Company library</h3></div>' + (r.company.length ? '<div class="col">' + r.company.map((x) => '<div class="row spread" style="padding:10px 0;border-bottom:1px solid var(--border)"><div class="row" style="gap:10px">' + icon('file', 18) + '<div><b>' + esc(x.title) + '</b><div class="meta">' + esc(x.category) + '</div></div></div><button class="btn secondary sm" data-v="' + x.fileId + '" data-n="' + attr(x.title) + '">' + icon('eye', 14) + 'View</button></div>').join('') + '</div>' : emptyHtml('No shared documents', 'Policies and forms shared by your company appear here.', 'file')) + '</div>';
    host.onclick = (e) => { const v = e.target.closest('[data-v]'); if (v) openFile(v.dataset.v, v.dataset.n); };
  };
  load();
};
VIEWS.employee.profile = function (host) {
  host.innerHTML = pageHead('My profile', 'Keep your contact details up to date.') + skelCards(2);
  const load = async () => {
    let r; try { r = await callApi('profile.get'); } catch (e) { return errorBox(host, e, load); }
    const e = r.employee, pr = r.profile;
    const fields = [{ name: 'email', label: 'Email', type: 'email', value: e.email }, { name: 'dob', label: 'Date of birth', type: 'date', max: todayStr(), value: pr.dob }, { name: 'gender', label: 'Gender', type: 'select', options: ['Male', 'Female', 'Other'], value: pr.gender }, { name: 'maritalStatus', label: 'Marital status', type: 'select', options: ['Single', 'Married', 'Other'], value: pr.maritalStatus },
      { name: 'address', label: 'Address', type: 'textarea', rows: 2, maxlength: 300, full: true, value: pr.address }, { name: 'emergencyContact', label: 'Emergency contact', maxlength: 100, full: true, value: pr.emergencyContact, placeholder: 'Name and phone number' }];
    host.innerHTML = pageHead('My profile', 'Keep your contact details up to date.') +
      '<div class="grid g-main"><div class="card"><div class="row" style="gap:16px;flex-wrap:wrap">' + avatarHtml(e.fullName, 'lg', e.photoFileId) + '<div class="grow"><h2>' + esc(e.fullName) + '</h2><div class="muted">' + esc(e.designation || 'Employee') + ' · ' + esc(e.empCode) + '</div><div class="row mt-s"><input type="file" id="phFile" class="hide" accept="image/*"><button class="btn secondary sm" id="phBtn">' + icon('image', 14) + 'Change photo</button></div></div></div>' +
      '<div class="mt" id="pfForm">' + formHtml(fields) + '</div><div class="row mt" style="justify-content:flex-end"><button class="btn" id="pfSave">' + icon('check', 16) + 'Save changes</button></div></div>' +
      '<div class="col"><div class="card"><div class="card-head"><h3>Employment</h3></div>' + kv([['Phone (login)', e.phone], ['Department', e.department], ['Joined', fmtDate(e.doj)], ['Type', e.employmentType]]) + '</div>' +
      '<div class="card mt"><div class="card-head"><h3>Bank & statutory</h3></div>' + kv([['Bank', e.bankName], ['Account', e.accountNo ? '••••' + e.accountNo.slice(-4) : ''], ['IFSC', e.ifsc], ['PAN', e.panNumber], ['UAN', e.uan], ['ESIC', e.esicNo]]) + '<div class="meta mt-s">Contact HR to change these details.</div></div>' +
      '<div class="card mt"><button class="btn secondary block" id="pwBtn">' + icon('key', 16) + 'Change password</button></div></div></div>';
    loadPhoto('.avatar[data-ph]');
    const root = $('#pfForm', host); wireForm(root);
    $('#pfSave', host).onclick = async (ev) => { const d = readForm(root, fields); if (!d) return; try { await callApi('profile.save', d, { btn: ev.currentTarget }); toast('Profile saved.', 'success'); } catch (x) { if (x.field) setFieldError(root, x.field, x.message); } };
    $('#pwBtn', host).onclick = () => changePasswordModal(false);
    $('#phBtn', host).onclick = () => $('#phFile', host).click();
    $('#phFile', host).onchange = async (ev) => { const f = ev.target.files[0]; if (!f) return; try { const up = await readUpload(f, { maxDim: 480, limitBytes: 600000 }); await callApi('profile.photo', { file: up }); Store.bust('photo_*'); toast('Photo updated.', 'success'); load(); } catch (x) { if (x && !x.code && x.message) toast(x.message, 'error'); } };
  };
  load();
};
VIEWS.employee.support = function (host) { ticketsView(host, { scope: 'mine', title: 'Support', sub: 'Raise a question or problem with your company admin.', createTo: 'COMPANY', createLabel: 'New request to admin', emptyText: 'Raise a ticket for payroll, attendance or app issues.' }); };

/* =====================================================================
   17. BOOTSTRAP
   ===================================================================== */
function splash(msg) { $('#app').innerHTML = '<div class="auth-wrap"><div class="center"><div class="logo-mark" style="margin:0 auto 14px;width:52px;height:52px;font-size:22px">A</div><div class="spinner" style="margin:0 auto"></div><p class="meta mt">' + esc(msg || 'Loading…') + '</p></div></div>'; }
async function init() {
  splash();
  try {
    const b = await callApi('boot', {}, { silent: true });
    S.platform = b.platform || { name: 'Astra HR', logo: '' };
    if (b.needsSetup) { $('#app').innerHTML = '<div class="auth-wrap"><div class="card auth-card" style="max-width:520px">' + emptyHtml('System not set up yet', 'Open the Apps Script editor, run setupSystem() once, then redeploy and reload this page.', 'settings') + '</div></div>'; return; }
    if (b.loggedIn) startApp(b); else { if (S.token) { S.token = ''; safeStore('astra.token', null); } renderAuth('company'); }
  } catch (e) {
    if (e.code === 'NO_BACKEND') { $('#app').innerHTML = '<div class="auth-wrap"><div class="card auth-card" style="max-width:520px">' + emptyHtml('Open the deployed web app', e.message, 'alert') + '</div></div>'; return; }
    $('#app').innerHTML = '<div class="auth-wrap"><div class="card auth-card" style="max-width:520px">' + emptyHtml('Could not reach the server', e.message || 'Please check your connection.', 'alert', '<button class="btn mt" id="retryBoot">' + icon('refresh', 16) + 'Retry</button>') + '</div></div>'; $('#retryBoot').onclick = init;
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.boot && S.token) { callApi('notif.list', {}, { silent: true }).then((r) => updateBell(r.unread)).catch(() => {}); } });
window.addEventListener('offline', () => toast('You are offline. Changes will not be saved until you reconnect.', 'warn', 6000));
window.addEventListener('online', () => toast('Back online.', 'success'));
window.addEventListener('unhandledrejection', (e) => { const r = e.reason; if (r && (r.code || r.message) && r.code) { e.preventDefault(); } });
init();
})();
</script>
