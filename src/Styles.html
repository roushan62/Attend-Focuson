<style>
/* =====================================================================
   FocusOn HRMS 2.0 — UI Styles
   Reuses Astra card theme, rebranded to FocusOn (indigo), with Hindi-ready
   typography, simple mode tiles, mobile bottom bar, dark mode.
   ===================================================================== */
:root{
  --primary:#4F46E5; --primary-rgb:79,70,229; --on-primary:#fff;
  --primary-soft:rgba(var(--primary-rgb),.10); --primary-ring:rgba(var(--primary-rgb),.28);
  --bg:#F5F6F8; --card:#FFFFFF; --card-2:#F9FAFB; --text:#111827; --muted:#6B7280;
  --border:#E5E7EB; --input-bg:#fff;
  --success:#16A34A; --success-soft:rgba(22,163,74,.12);
  --warning:#B45309; --warning-soft:rgba(245,158,11,.16);
  --danger:#DC2626; --danger-soft:rgba(220,38,38,.10);
  --info:#0369A1; --info-soft:rgba(3,105,161,.12);
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05);
  --shadow-hover:0 4px 10px rgba(16,24,40,.06),0 14px 32px rgba(16,24,40,.10);
  --radius:16px; --sidebar-w:252px; --ease:cubic-bezier(.4,0,.2,1);
  --skel-a:#EEF0F3; --skel-b:#F8F9FA;
  --font-main: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Devanagari", "Noto Sans", sans-serif;
}
[data-theme="dark"]{
  --bg:#0E1016; --card:#171A22; --card-2:#1C2029; --text:#E8EAF0; --muted:#9AA3B2; --border:#2A2F3B; --input-bg:#12151C;
  --primary-fg:color-mix(in srgb,var(--primary) 58%,#fff); --primary-soft:rgba(var(--primary-rgb),.22); --primary-ring:rgba(var(--primary-rgb),.45);
  --success:#4ADE80; --success-soft:rgba(74,222,128,.14);
  --warning:#FBBF24; --warning-soft:rgba(251,191,36,.14);
  --danger:#F87171; --danger-soft:rgba(248,113,113,.14);
  --info:#38BDF8; --info-soft:rgba(56,189,248,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.28);
  --shadow-hover:0 6px 14px rgba(0,0,0,.45),0 18px 40px rgba(0,0,0,.4);
  --skel-a:#232733; --skel-b:#2C3140; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font:14px/1.5 var(--font-main);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;transition:background .2s var(--ease),color .2s var(--ease)}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:24px}h2{font-size:20px}h3{font-size:16px}
p{margin:0}a{color:var(--primary);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.muted{color:var(--muted)}.meta{font-size:12px;color:var(--muted)}.strong{font-weight:600}
.right{text-align:right}.center{text-align:center}
.hide{display:none!important}.nowrap{white-space:nowrap}
.ic{flex:none;vertical-align:middle}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.spread{justify-content:space-between}.grow{flex:1;min-width:0}
.gap-s{gap:6px}.gap-l{gap:20px}
.mt{margin-top:16px}.mt-s{margin-top:8px}.mt-l{margin-top:24px}.mb{margin-bottom:16px}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);background:var(--card);border-right:1px solid var(--border);z-index:60;display:flex;flex-direction:column;transition:transform .22s var(--ease),width .22s var(--ease)}
.brand{display:flex;align-items:center;gap:12px;height:64px;padding:0 20px;flex:none}
.logo-mark{width:36px;height:36px;border-radius:10px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:800;flex:none}
.logo-mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand-name{font-weight:700;font-size:16px;line-height:1.15}.brand-sub{font-size:11px;color:var(--muted)}
.nav{flex:1;overflow:auto;padding:8px 12px 16px}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;margin:2px 0;border:0;background:none;border-radius:12px;color:var(--muted);font-weight:500;cursor:pointer;text-align:left;transition:background .18s var(--ease),color .18s var(--ease)}
.nav-item:hover{background:var(--primary-soft);color:var(--text);transform:translateX(2px)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--primary);transform:scaleY(0);transition:transform .2s var(--ease)}
.nav-item.active::before{transform:scaleY(1)}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}
.sidebar-foot{padding:12px;border-top:1px solid var(--border);flex:none}
.main{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;flex-direction:column;transition:margin .22s var(--ease)}
.app.collapsed .sidebar{width:76px}.app.collapsed .main{margin-left:76px}
.app.collapsed .nav-label,.app.collapsed .brand-text,.app.collapsed .nav-badge,.app.collapsed .sidebar-foot .label{display:none}
.app.collapsed .nav-item{justify-content:center;padding:12px}.app.collapsed .brand{justify-content:center;padding:0}
.header{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;gap:14px;padding:0 24px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.header .h-logo{display:none;align-items:center;gap:10px}
.search{position:relative;flex:1;max-width:520px;margin:0 auto}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--bg);padding:0 14px 0 40px;color:var(--text);outline:none;transition:border-color .18s,box-shadow .18s,background .18s}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-ring);background:var(--input-bg)}
.search .ic{position:absolute;left:13px;top:11px;color:var(--muted)}
.dropdown{position:absolute;z-index:70;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-hover);padding:8px;min-width:260px;max-height:70vh;overflow:auto;animation:pop .16s var(--ease)}
.search .dropdown{left:0;right:0;top:48px}
.dd-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left;transition:background .15s}
.dd-item:hover{background:var(--primary-soft)}
.dd-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px}
.icon-btn{position:relative;width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:background .18s,color .18s,transform .12s}
.icon-btn:hover{background:var(--primary-soft);color:var(--text)}.icon-btn:active{transform:scale(.94)}
.dot{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:99px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;overflow:hidden;background-size:cover;background-position:center}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:72px;height:72px;font-size:24px}.avatar.sm{width:30px;height:30px;font-size:11px}
.profile-btn{display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px 8px 4px 4px;border-radius:14px;cursor:pointer;transition:background .18s}
.profile-btn:hover{background:var(--primary-soft)}
.content{padding:24px;width:100%;max-width:1480px;margin:0 auto;flex:1}
.view{animation:enter .24s var(--ease)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head p{color:var(--muted);margin-top:2px}
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.show{opacity:1;pointer-events:auto}

/* ---------- simple mode tiles ---------- */
.simple-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding:24px;max-width:900px;margin:0 auto}
.simple-tile{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.simple-tile:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:var(--primary)}
.simple-tile .ico{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);font-size:30px}
.simple-tile .t{font-weight:700;font-size:17px;text-align:center}
.simple-tile .s{font-size:13px;color:var(--muted);text-align:center}

/* ---------- cards & grids ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;border:1px solid color-mix(in srgb,var(--border) 55%,transparent);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.card.lift:hover,.stat:hover,.card.click:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.card.click{cursor:pointer}
.card.flat{box-shadow:none;background:var(--card-2)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card-head h3{font-size:16px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}.g-stat{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.span2{grid-column:span 2}
.stat{display:flex;flex-direction:column;gap:8px;padding:18px 20px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--border) 55%,transparent);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.stat .top{display:flex;align-items:center;justify-content:space-between}
.stat .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.stat .ico.green{background:var(--success-soft);color:var(--success)}.stat .ico.amber{background:var(--warning-soft);color:var(--warning)}.stat .ico.red{background:var(--danger-soft);color:var(--danger)}.stat .ico.blue{background:var(--info-soft);color:var(--info)}
.stat .num{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat .lbl{color:var(--muted);font-size:13px}
.trend{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 8px}
.trend.up{color:var(--success);background:var(--success-soft)}.trend.down{color:var(--danger);background:var(--danger-soft)}.trend.flat{color:var(--muted);background:var(--card-2)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);padding:0 16px;font-weight:500;font-size:14px;cursor:pointer;transition:background .18s,color .18s,border-color .18s}
.btn:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
.btn.secondary{background:transparent}
.btn.success{background:var(--success);color:#fff;border-color:var(--success)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.lg{height:52px;font-size:16px;padding:0 24px}
.btn.block{width:100%}
.btn.sm{height:30px;font-size:13px;padding:0 10px}

/* ---------- forms ---------- */
form{display:contents}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--text)}
.field input,.field select,.field textarea{width:100%;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);padding:0 12px;outline:none;transition:border-color .18s,box-shadow .18s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-ring)}
.field.invalid input,.field.invalid select{border-color:var(--danger)}
.field .err{color:var(--danger);font-size:12px}
input[data-upper]{text-transform:uppercase}
.field textarea{height:80px;resize:vertical}
.field.full{grid-column:span 2}
.field.inline{width:auto}

/* ---------- modal / toast ---------- */
.backdrop{position:fixed;inset:0;background:rgba(10,12,18,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.backdrop.drawer{align-items:flex-end}
.modal{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-hover);width:100%;max-width:560px;max-height:90vh;overflow:auto;display:flex;flex-direction:column}
.backdrop.drawer .modal{border-radius:16px 16px 0 0;max-height:60vh}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-body{padding:16px 20px;overflow:auto;max-height:50vh}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--border)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--primary);color:var(--text);padding:12px 16px;border-radius:10px;box-shadow:var(--shadow-hover);z-index:200;display:flex;align-items:center;gap:10px;min-width:260px;animation:slidein .24s var(--ease)}
.toast.out{animation:slideout .22s var(--ease) forwards}
.toast.error{border-left-color:var(--danger)}.toast.success{border-left-color:var(--success)}.toast.warn{border-left-color:var(--warning)}
@keyframes slidein{from{transform:translateX(140px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideout{to{transform:translateX(140px);opacity:0}}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ---------- tables ---------- */
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px}
table.tbl{width:100%;border-collapse:collapse}
table.tbl th{background:var(--card-2);text-align:left;font-size:12px;font-weight:700;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
table.tbl tr:hover{background:var(--primary-soft)}
table.tbl tr.clickable{cursor:pointer}
table.tbl tr.clickable:hover{background:color-mix(in srgb,var(--border) 70%,transparent)}
table.tbl td.num{text-align:right}
.pager{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;color:var(--muted)}
.empty .ic-wrap{font-size:44px;opacity:.5;margin-bottom:12px}
.sk{background:var(--skel-a);border-radius:6px;height:14px;animation:pulse 1.4s infinite}
.sk.line{height:12px}
.sk.circle{border-radius:50%}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.7}}
.badge{display:inline-flex;align-items:center;height:22px;border-radius:99px;padding:0 8px;font-size:11px;font-weight:700;border:1px solid}
.badge.primary{background:var(--primary-soft);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 40%,transparent)}
.badge.green{background:var(--success-soft);color:var(--success)}
.badge.amber{background:var(--warning-soft);color:var(--warning)}
.badge.red{background:var(--danger-soft);color:var(--danger)}
.badge.blue{background:var(--info-soft);color:var(--info)}

/* ---------- auth ---------- */
.auth-wrap{display:flex;min-height:100vh;background:var(--bg)}
.auth-split{display:flex;flex:1}
.auth-art{flex:1;background:var(--primary);color:#fff;padding:40px;display:flex;flex-direction:column;justify-content:center}
.auth-card{width:400px;padding:40px;margin:auto;background:var(--card);border-radius:24px;box-shadow:var(--shadow)}
.auth-tabs{display:flex;gap:8px;margin-bottom:20px}
.auth-tabs .tab{flex:1;padding:10px;border:1px solid var(--border);background:transparent;border-radius:10px;cursor:pointer;color:var(--mixed,var(--muted));font-size:13px}
.auth-tabs .tab.on{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
.auth-links{margin-top:16px;font-size:13px;color:var(--mixed,var(--muted));display:flex;gap:12px;flex-wrap:wrap}
.alert{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;font-size:13px}
.alert.ok{background:var(--success-soft);color:var(--success)}.alert.warn{background:var(--warning-soft);color:var(--warning)}.alert.danger{background:var(--danger-soft);color:var(--danger)}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dow{font-size:11px;font-weight:700;color:var(--muted);padding:6px 0}
.day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;font-size:13px}
.day.today{background:var(--primary-soft);color:var(--primary);font-weight:700}
.day.sel{background:var(--primary);color:#fff;border-radius:10px}
.day.blank{pointer-events:none}
.cc{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:6px;font-size:10px;font-weight:700}
.cc.P{background:var(--success-soft);color:var(--success)}.cc.L{background:var(--warning-soft);color:var(--warning)}
.cc.A{background:var(--danger-soft);color:var(--danger)}.cc.V,.cc.U{background:var(--info-soft);color:var(--info)}
.cc.W,.cc.O{background:var(--card-2);color:var(--muted)}.cc.F{background:#f59e0b;color:#fff}
.legend-codes{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:8px}

/* ---------- mobile bottom bar ---------- */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;padding:8px;background:var(--card);border-top:1px solid var(--border);z-index:100}
.has-bar .content{padding-bottom:80px}

/* ---------- print ---------- */
@media print{.no-print{display:none}body{background:#fff} .card{box-shadow:none;border:none}}
</style>
