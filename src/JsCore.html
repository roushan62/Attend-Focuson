const PALETTE = ['var(--primary)', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#06B6D4', '#EC4899', '#64748B'];

}

    { id: 'leave', label: 'Leave', icon: 'leaf', perm: 'leave.approve' },
    { id: 'expenses', label: 'Expenses', icon: 'receipt', perm: 'expense.view' }
  ],
  employee: [
    { id: 'dashboard', label: 'Home', icon: 'home' },
    { id: 'attendance', label: 'Hazri', icon: 'calendar' },
    { id: 'leave', label: 'Chhutti', icon: 'leaf' },
    { id: 'payslip', label: 'Salary Slip', icon: 'wallet' },
    { id: 'profile', label: 'Meri Jaankari', icon: 'user' },
    { id: 'helpdesk', label: 'Support', icon: 'lifebuoy' }
  ]
};
function panelFor(user){
  if (_isSA(user)) return 'super';
  return user.panel || 'admin';
}
function _isSA(u){ return !!(u && u.role === 'SUPER_ADMIN'); }
function renderShell(){
  const b = S.boot, panel = S.panel = panelFor(b.user), items = NAV[panel].filter((n) => !n.perm || can(n.perm));
  const isEmp = panel === 'employee';
  const name = b.user.name || b.user.loginId;
  const brand = b.company || {};
  $('#app').innerHTML = '<div class="app' + (S.sidebarCollapsed ? ' collapsed' : '') + (isEmp ? ' has-bar' : '') + '">' +
    '<aside class="sidebar" id="sidebar"><div class="brand">' + logoMark(brand.logo, brand.name || appName()) + '<div class="brand-text"><div class="brand-name ellipsis" style="max-width:170px">' + esc(brand.name || appName()) + '</div><div class="brand-sub">' + (panel === 'super' ? 'Super Admin console' : 'FocusOn HRMS') + '</div></div></div>' +
    '<nav class="nav" id="nav">' + items.map((n) => '<button class="nav-item" data-nav="' + n.id + '" title="' + attr(n.label) + '">' + icon(n.icon, 20) + '<span class="nav-label">' + esc(n.label) + '</span><span data-badge="' + n.id + '"></span></button>').join('') + '</nav>' +
    '<div class="sidebar-foot"><button class="nav-item" id="logoutBtn" title="Sign out">' + icon('logout', 20) + '<span class="nav-label">Sign out</span></button></div></aside>' +
    '<div class="scrim" id="scrim"></div>' +
    '<div class="main"><header class="header"><button class="icon-btn" id="menuBtn" aria-label="Menu">' + icon('menu', 22) + '</button>' +
    '<div class="h-logo">' + logoMark(brand.logo, brand.name || appName()) + '<b class="ellipsis" style="max-width:120px">' + esc(brand.name || appName()) + '</b></div>' +
    '<div class="search"><div style="position:relative;flex:1;max-width:520px;margin:0 auto">' + icon('search', 18) + '<input id="gsearch" type="search" placeholder="Search employees…" autocomplete="off" aria-label="Search"><div class="dropdown hide" id="gsDrop"></div></div></div>' +
    '<div class="row" style="gap:4px;margin-left:auto">' +
    '<button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"></button>' +
    '<div style="position:relative"><button class="icon-btn" id="bellBtn" aria-label="Notifications">' + icon('bell', 20) + '<span class="dot hide" id="bellDot">0</span></button><div class="dropdown hide" id="bellDrop" style="right:0;width:min(340px,92vw)"></div></div>' +
    '<div style="position:relative"><button class="profile-btn" id="profBtn">' + avatarHtml(name, '', b.user.photoFileId || '') + '<div style="text-align:left"><div style="font-weight:600;font-size:13px;line-height:1.2" class="ellipsis">' + esc(name) + '</div><div class="meta">' + esc((panel === 'super' ? 'Super Admin' : (b.user.role || ''))) + '</div></div></button><div class="dropdown hide" id="profDrop" style="right:0;width:230px"></div></div>' +
    '</div></header><main class="content"><div class="view" id="view"></div></main></div>' +
    (isEmp ? '<div class="bottom-bar" id="bottomBar"><button class="btn secondary" data-bar="leave">' + icon('leaf', 20) + ' Leave</button><button class="btn success" data-bar="in">' + icon('login', 20) + ' Punch In</button><button class="btn danger" data-bar="out">' + icon('logout', 20) + ' Punch Out</button></div>' : '') + '</div>';
  setTheme(document.documentElement.getAttribute('data-theme') || 'light');
  wireShell(); loadPhoto('.profile-btn .avatar'); updateBell(b.counts ? b.counts.notifications : 0); startPolling(); route();
}
function loadPhoto(sel){
  $$(sel || '.avatar[data-ph]').forEach((el) => {
    const id = el.dataset.ph; if (!id || el.dataset.done) return; el.dataset.done = '1';
    const cached = S.cache['photo_' + id]; const apply = (src) => { if (src && el.isConnected) el.innerHTML = '<img alt="" src="' + attr(src) + '">'; };
    if (cached !== undefined) return apply(cached);
    callApi('file.get', { fileId: id }, { silent: true }).then((f) => { const src = /^image\//.test(f.mime) ? 'data:' + f.mime + ';base64,' + f.data : ''; S.cache['photo_' + id] = src; apply(src); }).catch(() => S.cache['photo_' + id] = '');
  });
}
function closeDropdowns(except){ ['gsDrop','bellDrop','profDrop'].forEach((id) => { const d = $('#' + id); if (d && d !== except) d.classList.add('hide'); }); }
function wireShell(){
  const sb = $('#sidebar'), scrim = $('#scrim'), app = $('.app');
  const openSb = (on) => { sb.classList.toggle('open', on); scrim.classList.toggle('show', on); };
  $('#menuBtn').onclick = () => { if (window.innerWidth <= 1024) openSb(!sb.classList.contains('open')); else { S.sidebarCollapsed = !S.sidebarCollapsed; safeStore('focuson.collapsed', S.sidebarCollapsed ? '1' : '0'); app.classList.toggle('collapsed', S.sidebarCollapsed); } };
  scrim.onclick = () => openSb(false);
  $('#nav').onclick = (e) => { const n = e.target.closest('[data-nav]'); if (n) { openSb(false); go(panelFor(S.boot.user) + '/' + n.dataset.nav); } };
  $('#logoutBtn').onclick = logout;
  $('#themeBtn').onclick = toggleTheme;
  const bb = $('#bottomBar'); if (bb) bb.onclick = (e) => { const b = e.target.closest('[data-bar]'); if (!b) return; if (b.dataset.bar === 'leave') openLeaveModal(); else doPunch(b.dataset.bar, b); };
  $('#bellBtn').onclick = (e) => { e.stopPropagation(); const d = $('#bellDrop'); closeDropdowns(d); d.classList.toggle('hide'); if (!d.classList.contains('hide')) loadNotifs(); };
  $('#profBtn').onclick = (e) => { e.stopPropagation(); const d = $('#profDrop'); closeDropdowns(d);
    d.innerHTML = '<div style="padding:8px 10px"><b>' + esc(S.boot.user.name || S.boot.user.loginId) + '</b><div class="meta">' + esc(S.boot.user.loginId) + '</div><div class="mt-s">' + badge(S.panel === 'super' ? 'Super Admin' : (S.boot.user.role || ''), 'primary') + '</div></div><hr style="border:0;border-top:1px solid var(--border);margin:6px 0"><button class="dd-item" data-p="pw">' + icon('key', 18) + ' Change password</button><button class="dd-item" data-p="theme">' + icon('moon', 18) + ' Toggle dark mode</button><button class="dd-item" data-p="out">' + icon('logout', 18) + ' Sign out</button>';
    d.classList.toggle('hide'); d.onclick = (ev) => { const p = ev.target.closest('[data-p]'); if (!p) return; d.classList.add('hide'); if (p.dataset.p === 'pw') changePasswordModal(); else if (p.dataset.p === 'theme') toggleTheme(); else logout(); };
  };
  const gs = $('#gsearch'); if (gs) { gs.addEventListener('input', debounce(async () => { const q = gs.value.trim(); if (q.length < 2) { $('#gsDrop').classList.add('hide'); return; } try { const r = await callApi('search.global', { q }, { silent: true }); $('#gsDrop').classList.remove('hide'); $('#gsDrop').innerHTML = (r.employees || []).map((x) => '<button class="dd-item" data-go="' + x.empId + '">' + avatarHtml(x.name, 'sm') + '<div><div style="font-weight:600">' + esc(x.name) + '</div><div class="meta">' + esc(x.empCode || '') + ' · ' + esc(x.designationId || 'Employee') + '</div></div></button>').join('') || '<div class="meta" style="padding:14px">No results.</div>'; } catch (e) { $('#gsDrop').classList.add('hide'); } }, 280)); }
  $('#gsDrop').addEventListener('click', (e) => { const g = e.target.closest('[data-go]'); if (g) { $('#gsDrop').classList.add('hide'); gs.value = ''; go('employee/' + g.dataset.go); } });
}
document.addEventListener('click', (e) => { if (!e.target.closest('.dropdown') && !e.target.closest('.search')) closeDropdowns(); });

/* ---------- notifications ---------- */
function updateBell(n){ const d = $('#bellDot'); if (!d) return; S.unread = n || 0; d.textContent = n > 99 ? '99+' : n; d.classList.toggle('hide', !n); }
function ago(iso){ if (!iso) return ''; const t = new Date(iso).getTime(), m = Math.max(0, Math.round((Date.now() - t) / 60000)); if (isNaN(t)) return fmtDate(iso); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; if (m < 1440) return Math.floor(m / 60) + ' h ago'; if (m < 10080) return Math.floor(m / 1440) + ' d ago'; return fmtDate(iso); }
async function loadNotifs(){
  const d = $('#bellDrop'); d.innerHTML = '<div style="padding:12px">' + skelLines(4) + '</div>';
  try {
    const r = await callApi('notif.list', {}, { silent: true }); updateBell(r.unread);
    d.innerHTML = '<div class="row spread" style="padding:6px 10px"><b>Notifications</b>' + (r.unread ? '<button class="btn ghost sm" data-all>Mark all read</button>' : '') + '</div>' +
      (r.items.length ? r.items.map((n) => '<div class="dd-item" style="align-items:flex-start;cursor:default">' + (n.isRead ? '' : '<span class="pulse" style="margin-top:6px"></span>') + '<div class="grow"><div style="font-size:13.5px' + (n.isRead ? ';color:var(--muted)' : ';font-weight:600') + '">' + esc(n.message) + '</div><div class="meta">' + ago(n.createdAt) + '</div></div></div>').join('') : emptyHtml('All caught up', 'No notifications yet.', 'bell'));
    const all = $('[data-all]', d); if (all) all.onclick = async () => { await callApi('notif.read', { all: true }); updateBell(0); loadNotifs(); };
  } catch (e) { d.innerHTML = '<div class="meta" style="padding:14px">Could not load notifications.</div>'; }
}
let pollTimer = null, pollN = 0;
function startPolling(){
  clearInterval(pollTimer); pollN = 0;
  pollTimer = setInterval(async () => {
    if (document.hidden || !S.token || !S.boot) return;
    try { const r = await callApi('notif.list', {}, { silent: true }); updateBell(r.unread); if (++pollN % 6 === 0) await refreshCounts(); } catch (e) { /* silent */ }
  }, 120000);
}
async function refreshCounts(){
  if (!S.token) return;
  try { const b = await callApi('boot', {}, { silent: true }); if (b && b.loggedIn) { S.boot.counts = b.counts; updateBell(b.counts.notifications); } } catch (e) { /* silent */ }
}

/* ---------- auth screens ---------- */
function setTheme(t){ document.documentElement.setAttribute('data-theme', t); safeStore('focuson.theme', t); const b = $('#themeBtn'); if (b) b.innerHTML = icon(t === 'dark' ? 'sun' : 'moon', 19); }
function toggleTheme(){ setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }
function applyBrand(hex){ /* brand color applied via settings later */ }
function authShell(inner){
  $('#app').innerHTML = '<div class="auth-wrap"><div class="auth-split">' +
    '<div class="auth-art"><div style="padding:40px;color:#fff"><div style="font-size:40px;margin-bottom:12px">' + icon('wallet', 40) + '</div><h2>FocusOn HRMS 2.0</h2><p class="mt-s" style="opacity:.9">Attendance • Leave • Payroll • People — in one place.</p>' +
    '<div class="mt" style="display:flex;gap:10px;flex-wrap:wrap">' +
    '<div style="display:flex;align-items:center;gap:8px">' + icon('calendar', 18) + '<span style="opacity:.95">Geo-fenced check-in</span></div>' +
    '<div style="display:flex;align-items:center;gap:8px">' + icon('leaf', 18) + '<span style="opacity:.95">Leave &amp; balances</span></div>' +
    '<div style="display:flex;align-items:center;gap:8px">' + icon('wallet', 18) + '<span style="opacity:.95">Payslips &amp; payroll</span></div>' +
    '<div style="display:flex;align-items:center;gap:8px">' + icon('shield', 18) + '<span style="opacity:.95">Role-based access</span></div>' +
    '</div></div></div>' +
    '<div class="card auth-card view" style="max-width:400px;margin:auto;padding:32px">' + inner + '</div>' +
    '</div></div><div style="position:fixed;top:12px;right:12px"><button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"></button></div>';
  $('#themeBtn').onclick = toggleTheme; setTheme(document.documentElement.getAttribute('data-theme') || 'light');
}
function renderAuth(mode, note){
  S.boot = null; S.panel = ''; S.view = '';
  const isSuper = mode === 'super';
  const fields = [
    { name: 'loginId', label: isSuper ? 'Employee Code / Email / Mobile' : 'Employee Code / Email / Mobile', type: 'text', required: true, placeholder: 'FO-0001 or email or mobile', full: true, autocomplete: 'username' },
    { name: 'password', label: 'Password', type: 'password', required: true, placeholder: 'Your password', full: true, autocomplete: 'current-password' }
  ];
  authShell('<h1>' + (isSuper ? 'Super Admin sign in' : 'Welcome back') + '</h1><p class="muted mt-s">Sign in to FocusOn HRMS</p>' +
    (note ? '<div class="alert ' + (note.type || 'ok') + ' mt">' + icon(note.type === 'warn' ? 'alert' : 'checkcircle', 18) + '<div>' + esc(note.text) + '</div></div>' : '') +
    '<div class="mt" id="loginForm">' + formHtml(fields) + '</div><div id="loginErr"></div>' +
    '<button class="btn lg block mt" id="loginBtn">' + icon('login', 18) + ' Sign in</button>' +
    '<div class="auth-links mt">' +
    '<a href="#" data-a="forgot">Forgot password?</a>' +
    (isSuper ? '<a href="#" data-m="company">Employee sign in</a>' : '<a href="#" data-m="super">Super Admin</a>') +
    '</div>' +
    (isSuper ? '' : '<div class="meta center mt"><a href="#" data-m="super">Super Admin sign in</a></div>'));
  const root = $('#loginForm'); wireForm(root);
  const form = $('form', root); const submit = async () => {
    const d = readForm(root, fields); if (!d) return; $('#loginErr').innerHTML = '';
    try { const res = await callApi('auth.login', { mode: isSuper ? 'super' : 'company', loginId: d.loginId, password: d.password }, { btn: $('#loginBtn'), inline: true }); onLoggedIn(res); }
    catch (e) { if (e.field) setFieldError(root, e.field, e.message); else $('#loginErr').innerHTML = '<div class="alert danger mt">' + icon('alert', 18) + '<div>' + esc(e.message) + '</div></div>'; }
  };
  form.addEventListener('submit', (e) => { e.preventDefault(); submit(); }); $('#loginBtn').onclick = submit;
  $$('[data-m]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); renderAuth(a.dataset.m); }));
  $$('[data-a]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); renderForgot(); }));
}
function renderForgot(){
  const fields = [{ name: 'loginId', label: 'Employee Code / Email / Mobile', type: 'text', required: true, full: true }];
  authShell('<h1>Forgot password</h1><p class="muted mt-s">An OTP will be sent to your registered email.</p>' +
    '<div class="mt" id="forgotForm">' + formHtml(fields) + '</div><button class="btn lg block mt" id="forgotBtn">Send OTP</button>' +
    '<div class="auth-links mt"><a href="#" data-m="company">← Back to sign in</a></div>');
  const root = $('#forgotForm'); wireForm(root);
  $('#forgotBtn').onclick = async () => {
    const d = readForm(root, fields); if (!d) return;
    try { await callApi('auth.forgot', { loginId: d.loginId }); renderAuth('company', { type: 'ok', text: 'OTP sent to your registered email.' }); }
    catch (e) { toast(e.message, 'error'); }
  };
  $('#forgotForm').addEventListener('submit', (e) => { e.preventDefault(); $('#forgotBtn').click(); });
  $$('[data-m]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); renderAuth(a.dataset.m); }));
}
function changePasswordModal(){
  formModal({ title: 'Change password', fields: [
    { name: 'oldPassword', label: 'Current password', type: 'password', required: true },
    { name: 'newPassword', label: 'New password', type: 'password', required: true, minLength: SEC ? SEC.passwordMinLength : 8 },
    { name: 'confirm', label: 'Confirm new password', type: 'password', required: true }
  ], onSubmit: async (data) => {
    if (data.newPassword !== data.confirm) throw { field: 'confirm', message: 'Passwords do not match.' };
    const res = await callApi('auth.changepassword', { token: S.token, oldPassword: data.oldPassword, newPassword: data.newPassword });
    toast('Password changed.', 'success');
  }});
}

/* ---------- login result ---------- */
async function onLoggedIn(res){
  S.token = res.token; safeStore('focuson.token', S.token);
  const b = await callApi('boot', { token: S.token });
  if (!b || !b.loggedIn) { sessionLost(); return; }
  S.boot = b; S.panel = panelFor(b.user);
  renderShell();
}
function logout(){
  callApi('auth.logout', { token: S.token }).then(() => { sessionLost(); }, () => { sessionLost(); });
}

/* ---------- router ---------- */
function route(){
  const hash = location.hash.slice(2) || (panelFor(S.boot.user) === 'employee' ? 'employee/dashboard' : panelFor(S.boot.user) + '/dashboard');
  const parts = hash.split('/');
  const panel = parts[0], view = parts[1], id = parts[2];
  if (!NAV[panel]) { $('#view').innerHTML = '<div class="card">' + emptyHtml('Invalid section', 'Unknown panel: ' + esc(panel), 'alert') + '</div>'; return; }
  S.panel = panel; S.view = view; S.params = parts.slice(2);
  // highlight nav
  $$('[data-nav]', $('#nav')).forEach((el) => el.classList.toggle('active', el.dataset.nav === view));
  // dispatch
  const vname = (panel === 'employee' ? 'self_' : (panel === 'super' ? 'admin_' : (panel === 'hr' ? 'hr_' : (panel === 'accounts' ? 'payroll_' : 'view_')))) + view;
  const fn = window[vname];
  if (typeof fn === 'function') { $('#view').innerHTML = '<div class="view">' + skelCards(3) + '</div>'; fn(id || ''); }
  else { $('#view').innerHTML = '<div class="card">' + emptyHtml('Under construction', 'The view "' + esc(view) + '" is being built.', 'alert') + '</div>'; }
}
window.addEventListener('hashchange', route);

/* ---------- init ---------- */
function INIT(){
  if (S.token) {
    callApi('boot', { token: S.token }).then((b) => { if (b && b.loggedIn) { S.boot = b; S.panel = panelFor(b.user); renderShell(); } else { renderAuth('company'); } }, () => { renderAuth('company'); });
  } else { renderAuth('company'); }
}
</script>
