<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Application status — SiteTrack</title>
<meta name="theme-color" content="#0b1220">
<?!= includeCss_('app_css') ?>
</head>
<body>
<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-head">
      <div class="logo"><?!= logoSvgLarge_() ?></div>
      <h1 data-i18n="checkStatus">Check your application status</h1>
      <p class="sub">Look up your company signup request with the request ID, e-mail or mobile number.</p>
    </div>

    <div class="field mt"><label>Request ID / e-mail / mobile</label>
      <div class="row" style="gap:8px">
        <input id="key" placeholder="REQ-… or owner@company.in or mobile">
        <button class="btn primary" id="searchBtn" data-i18n="checkStatus">Check</button>
      </div>
    </div>

    <div id="result" class="mt"></div>

    <p class="tiny muted mt" style="text-align:center">
      <a href="?page=signup">Register a company</a> · <a href="?page=login">Sign in</a> · <a href="?page=index">Home</a>
    </p>
  </div>
</main>

<div id="toasts"></div>
<?!= includeJs_('tmpl_config_js') ?>
<?!= includeJs_('i18n_js') ?>
<?!= includeJs_('api_js') ?>
<?!= includeJs_('ui_js') ?>
<script>
(function () {
  var h = ST.ui.h, el = ST.ui.el, toast = ST.ui.toast, badge = ST.ui.badge, fmtDateTime = ST.ui.fmtDateTime;
  ST.i18n.apply(document.body);

  function lookup() {
    var key = el('key').value.trim();
    if (key.length < 4) return toast('Enter your request ID, e-mail or mobile number', 'bad');
    ST.ui.loading(el('result'));
    ST.api.must('signupStatus', { requestId: key }).then(function (data) {
      if (!data.found) return ST.ui.empty(el('result'), data.message || 'Not found', '🔍');
      var r = data.request;
      var approved = r.status === 'Approved';
      ST.ui.render(el('result'), [
        h('div.ok-box' + (approved ? '.good' : ''), [
          h('div.row', { style: { alignItems: 'center', gap: '10px' } }, [
            h('h3', { style: { margin: '0' } }, r.companyName),
            badge(r.status)
          ]),
          ST.ui.kvList([
            ['Request ID', r.requestId],
            ['Submitted', fmtDateTime(r.submittedAt)],
            ['Reviewed', r.reviewedAt ? fmtDateTime(r.reviewedAt) : ''],
            ['Company ID', r.companyId],
            ['Note', r.reviewNote]
          ]),
          h('p.tiny.mt', null, r.nextStep),
          approved ? h('a.btn.primary.mt', { href: '?page=login' }, 'Go to sign in') : null
        ])
      ]);
    }).catch(function (e) { ST.ui.render(el('result'), h('div.err-box', null, e.message)); });
  }

  el('searchBtn').addEventListener('click', lookup);
  el('key').addEventListener('keydown', function (e) { if (e.key === 'Enter') lookup(); });

  var q = new URLSearchParams(location.search).get('requestId');
  if (q) { el('key').value = q; lookup(); }
})();
</script>
</body>
</html>
